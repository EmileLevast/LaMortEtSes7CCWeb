name: Manual Server Deploy (EC2)

# Permet le déclenchement manuel depuis l'onglet Actions
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Raison du déploiement'
        required: false
        default: 'Mise à jour manuelle du serveur'

jobs:
  build-server:
    name: Build Ktor Server
    runs-on: windows-latest # On garde windows comme ton original pour la cohérence Gradle
    permissions: write-all

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 20
        uses: actions/setup-java@v4
        with:
          java-version: '20'
          distribution: 'temurin'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build FatJar Ktor with Gradle
        run: gradle :server:buildFatJar # Utilisation du chemin explicite du module

      - name: Upload FatJar artifact
        uses: actions/upload-artifact@v4
        with:
          name: serverLFP-manual
          path: ./server/build/libs/server-all.jar

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-server

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: serverLFP-manual

      - name: Upload FatJar to EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "server-all.jar"
          target: "/home/ec2-user/files/"

      - name: Restart service on EC2
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo chmod 755 /home/ec2-user/files/server-all.jar
            sudo systemctl stop lesfeusperegrins
            sudo systemctl restart lesfeusperegrins